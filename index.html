<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Gram Shooter</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{--g1:rgba(255,255,255,.2);--g2:rgba(255,255,255,.05);--ac:#6ee7ff;--ac2:#b388ff;--tx:#f4f8ff;--mut:rgba(244,248,255,.62)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:none}
html,body{margin:0;height:100%;overflow:hidden;background:#070b14;color:var(--tx);font-family:-apple-system,"SF Pro Display",Inter,Roboto,sans-serif}
canvas#c{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.glass{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--g1),var(--g2));backdrop-filter:blur(22px) saturate(190%) brightness(1.08);-webkit-backdrop-filter:blur(22px) saturate(190%) brightness(1.08);border:1px solid rgba(255,255,255,.26);box-shadow:inset 0 1.5px 1px rgba(255,255,255,.6),inset 0 -10px 24px rgba(255,255,255,.05),inset 0 0 30px rgba(120,200,255,.07),0 14px 40px rgba(0,0,0,.4);border-radius:26px}
.glass::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.3) 48%,transparent 60%);transform:translateX(-120%);animation:sheen 7s ease-in-out infinite}
.glass::after{content:"";position:absolute;left:8%;right:8%;top:0;height:42%;pointer-events:none;border-radius:0 0 50% 50%;background:linear-gradient(180deg,rgba(255,255,255,.18),transparent)}
@keyframes sheen{0%,55%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
.scr{position:fixed;inset:0;display:none;padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom));pointer-events:none}
.scr.on{display:flex;flex-direction:column}.scr>*{pointer-events:auto}
.btn{border:0;color:var(--tx);font:700 16px -apple-system,Inter,Roboto,sans-serif;padding:15px 22px;border-radius:999px;cursor:pointer;transition:transform .12s,filter .2s;text-align:center}
.btn:active{transform:scale(.93)}.btn.pri{background:linear-gradient(135deg,rgba(110,231,255,.65),rgba(179,136,255,.6))}
.btn:disabled{opacity:.45}
.chip{display:flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;font-weight:700;font-size:15px}
.top{display:flex;justify-content:space-between;gap:8px}
.dock{display:flex;gap:6px;padding:7px;border-radius:999px;margin:12px auto 0}
.dock .btn{padding:11px 20px;font-size:14px;background:transparent}.dock .btn.act{background:linear-gradient(135deg,rgba(255,255,255,.3),rgba(255,255,255,.08));box-shadow:inset 0 1px 1px rgba(255,255,255,.6)}
.grow{flex:1}.col{display:flex;flex-direction:column;gap:10px}
.panel{padding:18px}.mut{color:var(--mut);font-size:13px}
.title{font-size:30px;font-weight:800;letter-spacing:-.5px;text-shadow:0 4px 24px rgba(110,231,255,.5)}
.skins{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 10px;scroll-snap-type:x mandatory;touch-action:pan-x}
.skins::-webkit-scrollbar{display:none}
.sk{flex:0 0 122px;scroll-snap-align:center;padding:12px 10px;border-radius:22px;text-align:center;cursor:pointer;transition:transform .2s}
.sk.sel{transform:translateY(-6px) scale(1.04);border-color:rgba(255,255,255,.7)}
.sk .dot{width:44px;height:44px;border-radius:14px;margin:0 auto 8px;box-shadow:0 0 22px currentColor}
.sk b{display:block;font-size:13px}.sk small{font-size:11px;color:var(--mut)}
input{width:100%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);border-radius:16px;padding:13px 14px;color:var(--tx);font-size:15px;outline:0;touch-action:auto;user-select:text;-webkit-user-select:text}
.row{display:flex;gap:8px;align-items:center}.row>*{min-width:0}
.hist{font-size:13px;display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.1)}
.bar{height:14px;border-radius:9px;background:rgba(0,0,0,.35);overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.5)}
.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff5d7a,#ffb86b);transition:width .15s}
.wbtn{padding:7px 9px;border-radius:16px;font-size:11px;font-weight:700;text-align:center;min-width:62px;cursor:pointer;color:var(--tx)}
.wbtn.on{border-color:#fff;box-shadow:0 0 18px var(--ac),inset 0 1px 1px rgba(255,255,255,.7)}
.wbtn small{display:block;font-weight:500;opacity:.75;font-size:10px}
.stick{position:fixed;border-radius:50%;width:120px;height:120px;margin:-60px 0 0 -60px;display:none;pointer-events:none}
.stick i{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.45);box-shadow:inset 0 1px 2px #fff}
#dmg{position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 90px rgba(255,40,70,.0);transition:box-shadow .25s}
.fl{position:fixed;pointer-events:none;font-weight:800;font-size:15px;color:#9dffdf;text-shadow:0 2px 8px #000;animation:fl .9s forwards}
@keyframes fl{to{transform:translateY(-46px);opacity:0}}
#toast{position:fixed;left:50%;top:max(16px,env(safe-area-inset-top));transform:translate(-50%,-90px);padding:12px 20px;border-radius:999px;transition:transform .35s;z-index:9;font-weight:600;font-size:14px}
#toast.on{transform:translate(-50%,0)}
.big{font-size:44px;font-weight:800}
#home,#shop,#wallet{padding-bottom:calc(max(14px,env(safe-area-inset-bottom)) + 78px)}
#wallet{pointer-events:auto;touch-action:pan-y}#wallet *{touch-action:pan-y}#wallet input{touch-action:auto}
.skins *{touch-action:pan-x}
</style></head><body>
<canvas id="c"></canvas><div id="dmg"></div><div id="toast" class="glass"></div>

<!-- HOME -->
<div id="home" class="scr">
  <div class="top"><div class="chip glass">💎 <span id="bal">0.0000</span> TON</div><div class="chip glass">☠ <span id="tk">0</span></div></div>
  <div class="grow"></div>
  <div class="col" style="align-items:center;margin-bottom:6px"><div class="title">GRAM SHOOTER</div><div class="mut">Every kill pays real TON</div></div>
  <button class="btn glass pri" id="play" style="font-size:20px;padding:19px">▶ PLAY</button>
</div>

<!-- SHOP -->
<div id="shop" class="scr">
  <div class="top"><div class="chip glass">💎 <span class="balx">0.0000</span> TON</div></div>
  <div class="grow"></div>
  <div class="glass panel col" style="gap:8px"><div class="row"><div class="grow"><b id="sn" style="font-size:20px"></b><div class="mut" id="sr"></div></div><button class="btn glass pri" id="sbtn" style="padding:13px 22px"></button></div></div>
  <div class="skins" id="skins" style="margin-top:10px"></div>
</div>

<!-- WALLET -->
<div id="wallet" class="scr" style="overflow:auto">
  <div class="glass panel col" style="margin-top:6px"><div class="mut">Game balance</div><div class="big"><span class="balx">0.0000</span> <small style="font-size:18px">TON</small></div><div class="mut" id="wmin"></div></div>
  <div class="glass panel col" style="margin-top:10px"><b>Withdraw</b><input id="wa" placeholder="Your TON address"><div class="row"><input id="wm" type="number" step="0.01" placeholder="Amount (TON)"><button class="btn glass pri" id="wb" style="padding:13px 18px">Send</button></div></div>
  <div class="glass panel col" style="margin-top:10px"><b>Deposit</b><div class="mut">Send TON to this address with the exact comment:</div><div class="row"><input id="da" readonly><button class="btn glass" data-copy="da" style="padding:12px 14px">Copy</button></div><div class="row"><input id="dc" readonly><button class="btn glass" data-copy="dc" style="padding:12px 14px">Copy</button></div></div>
  <div class="glass panel" style="margin:10px 0 90px"><b>Withdrawals</b><div id="wl"></div></div>
</div>

<!-- HUD -->
<div id="hud" class="scr" style="padding:0">
  <div style="padding:max(12px,env(safe-area-inset-top)) 12px 0" class="col">
    <div class="row"><div class="glass chip grow" style="padding:8px 12px"><div class="bar grow"><i id="hp"></i></div></div><div class="glass chip">💎 +<span id="earn">0.000</span></div></div>
    <div class="row"><div class="glass chip" style="padding:6px 12px;font-size:13px">Wave <span id="wv">1</span></div><div class="glass chip" style="padding:6px 12px;font-size:13px">☠ <span id="kl">0</span></div><div class="glass chip" style="padding:6px 12px;font-size:13px" id="am"></div></div>
  </div>
  <div class="grow"></div>
  <div class="row" id="wbtns" style="justify-content:center;padding:0 8px max(10px,env(safe-area-inset-bottom));gap:5px"></div>
</div>
<div id="sL" class="stick glass"><i></i></div><div id="sR" class="stick glass"><i></i></div>

<!-- GAME OVER -->
<div id="over" class="scr" style="justify-content:center">
  <div class="glass panel col" style="text-align:center;gap:14px"><div class="title">DOWN!</div><div class="mut">Wave <b id="ow">1</b> · Kills <b id="ok">0</b></div><div class="big">+<span id="oe">0.000</span> TON</div>
  <button class="btn glass pri" id="again">Play again</button><button class="btn glass" id="ohome">Home</button></div>
</div>

<div id="dockw" class="scr" style="justify-content:flex-end;padding-top:0;z-index:2"><div class="dock glass" id="dock"><button class="btn act" data-go="home">Home</button><button class="btn" data-go="shop">Shop</button><button class="btn" data-go="wallet">Wallet</button></div></div>

<script>
'use strict';
const T=THREE, TG=window.Telegram&&Telegram.WebApp; if(TG){TG.ready();TG.expand();try{TG.disableVerticalSwipes()}catch(e){}}
const $=id=>document.getElementById(id), fmt=n=>(Number(n)/1e9).toFixed(4);
const buzz=t=>{try{TG.HapticFeedback.impactOccurred(t||'light')}catch(e){}};
let toastT; function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2400)}
async function api(p,b){const r=await fetch(p,{method:b?'POST':'GET',headers:{'Content-Type':'application/json','X-Init':(TG&&TG.initData)||''},body:b?JSON.stringify(b):undefined});const j=await r.json();if(!r.ok)throw new Error(j.error||'Error');return j}

/* ================= DATA ================= */
const SK={
 pixel_knight:{skin:0xf1c9a0,body:0x5b7fb8,leg:0x3d4f73,glow:0x9fd0ff,hat:'knight',fx:null},
 neon_ninja:{skin:0xe8b98f,body:0x15181f,leg:0x15181f,glow:0x39ffb6,hat:'ninja',fx:'trail'},
 frost_mage:{skin:0xf3d3bb,body:0x3b7bd8,leg:0x2a4f93,glow:0x7fe3ff,hat:'mage',fx:'orbit'},
 cyber_samurai:{skin:0xe0b08c,body:0x2a2438,leg:0x1c1828,glow:0xff4fd8,hat:'samurai',fx:'spark'},
 toxic_hazmat:{skin:0xd9c9a3,body:0xe3c628,leg:0xb59d1b,glow:0xb6ff3b,hat:'hazmat',fx:'rise'},
 inferno_demon:{skin:0xc7311f,body:0x8f1d12,leg:0x5e1209,glow:0xff6a2b,hat:'demon',fx:'rise'},
 golden_pharaoh:{skin:0xd8a46a,body:0xd9a82b,leg:0xf2e6b8,glow:0xffd24a,hat:'pharaoh',fx:'spark'},
 void_phantom:{skin:0x2b1a4d,body:0x3b2570,leg:0x3b2570,glow:0xa66bff,hat:'phantom',fx:'orbit'}
};
const W=[
 {n:'Pistol',dmg:22,rate:3.6,mag:12,rel:1,pel:1,spr:.03,spd:42,rng:26,col:0xcfd8e6,len:.35},
 {n:'SMG',dmg:12,rate:11,mag:32,rel:1.5,pel:1,spr:.09,spd:44,rng:22,col:0x7be0ff,len:.5},
 {n:'Shotgun',dmg:11,rate:1.15,mag:6,rel:1.9,pel:8,spr:.26,spd:36,rng:14,col:0xffb347,len:.6},
 {n:'Rifle',dmg:31,rate:5.2,mag:24,rel:1.7,pel:1,spr:.02,spd:55,rng:34,col:0x9dff8a,len:.75},
 {n:'Sniper',dmg:130,rate:.85,mag:5,rel:2.3,pel:1,spr:0,spd:90,rng:60,col:0xff6bd6,len:1,pierce:1}
];
const ET={
 grunt:{skin:'toxic_hazmat',hp:55,sp:3,dmg:9,r:.55,sc:1},
 runner:{skin:'neon_ninja',hp:38,sp:5.6,dmg:7,r:.5,sc:.95,zig:1},
 gunner:{skin:'cyber_samurai',hp:85,sp:2.6,dmg:8,r:.55,sc:1,rng:11,rate:1.1,pspd:16},
 tank:{skin:'inferno_demon',hp:300,sp:2,dmg:20,r:.9,sc:1.55},
 sniper:{skin:'frost_mage',hp:70,sp:2.2,dmg:26,r:.55,sc:1,rng:20,rate:.45,pspd:34,laser:1},
 boss:{skin:'void_phantom',hp:1600,sp:2.4,dmg:14,r:1.2,sc:2.1,rng:14,rate:.8,pspd:14,burst:6}
};
const CR=[[-8,-6,3,3],[7,-9,3,2],[-14,8,2,4],[12,6,4,3],[0,12,3,2],[-3,-16,4,2],[17,-2,2,3],[-18,-8,2,3],[3,0,2,2]];
const ARENA=24;

/* ================= 3D SETUP ================= */
const canvas=$('c'),R=new T.WebGLRenderer({canvas,antialias:false});
const PX=.55;
const scene=new T.Scene();scene.background=new T.Color(0x0a1020);scene.fog=new T.Fog(0x0a1020,26,70);
const cam=new T.PerspectiveCamera(52,1,.1,300);
scene.add(new T.AmbientLight(0xffffff,.75));
const sun=new T.DirectionalLight(0xffffff,.85);sun.position.set(10,20,8);scene.add(sun);
function resize(){const w=innerWidth,h=innerHeight;R.setPixelRatio(PX);R.setSize(w,h,false);cam.aspect=w/h;cam.fov=w/h<.8?62:52;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
const gc={},mc={};
const geo=(w,h,d)=>gc[w+'_'+h+'_'+d]||(gc[w+'_'+h+'_'+d]=new T.BoxGeometry(w,h,d));
const mat=c=>mc[c]||(mc[c]=new T.MeshLambertMaterial({color:c}));
const glowM=c=>mc['g'+c]||(mc['g'+c]=new T.MeshBasicMaterial({color:c}));
function box(w,h,d,c,x,y,z,gl){const m=new T.Mesh(geo(w,h,d),gl?glowM(c):mat(c));m.position.set(x,y,z);return m}
function checkTex(c1,c2,rep){const cv=document.createElement('canvas');cv.width=cv.height=16;const x=cv.getContext('2d');for(let i=0;i<4;i++)for(let j=0;j<4;j++){x.fillStyle=(i+j)%2?c1:c2;x.fillRect(i*4,j*4,4,4)}const t=new T.CanvasTexture(cv);t.magFilter=T.NearestFilter;t.wrapS=t.wrapT=T.RepeatWrapping;t.repeat.set(rep,rep);return t}

/* arena */
const arena=new T.Group();scene.add(arena);
const floor=new T.Mesh(new T.PlaneGeometry(ARENA*2+8,ARENA*2+8),new T.MeshLambertMaterial({map:checkTex('#18223a','#1d2a47',(ARENA*2+8)/2)}));floor.rotation.x=-Math.PI/2;arena.add(floor);
[[0,-ARENA-1,ARENA*2+4,2],[0,ARENA+1,ARENA*2+4,2],[-ARENA-1,0,2,ARENA*2+4],[ARENA+1,0,2,ARENA*2+4]].forEach(([x,z,w,d])=>{arena.add(box(w,2.4,d,0x2c3b66,x,1.2,z));arena.add(box(w,.2,d,0x6ee7ff,x,2.45,z,1))});
const colBoxes=[];
CR.forEach(([x,z,w,d],i)=>{arena.add(box(w,1.8,d,0x37466e,x,.9,z));arena.add(box(w+.1,.15,d+.1,i%2?0xb388ff:0x6ee7ff,x,1.85,z,1));colBoxes.push({x,z,hw:w/2,hd:d/2})});
/* lobby */
const lobby=new T.Group();lobby.position.set(300,0,0);scene.add(lobby);
const lfloor=new T.Mesh(new T.PlaneGeometry(60,60),new T.MeshLambertMaterial({map:checkTex('#101831','#15203d',30)}));lfloor.rotation.x=-Math.PI/2;lobby.add(lfloor);
const ped=new T.Group();ped.add(box(2.6,.4,2.6,0x2c3b66,0,.2,0));const ring=box(2.9,.08,2.9,0x6ee7ff,0,.42,0,1);ped.add(ring);lobby.add(ped);
const stars=[];for(let i=0;i<40;i++){const s=box(.12,.12,.12,i%2?0xb388ff:0x6ee7ff,(Math.random()-.5)*24,Math.random()*9,(Math.random()-.5)*24-4,1);s.userData.p=Math.random()*6;lobby.add(s);stars.push(s)}

/* ================= CHARACTERS ================= */
function gunMesh(wi){const w=W[wi],g=new T.Group();g.add(box(.14,.16,w.len,0x222a38,0,0,w.len/2));g.add(box(.1,.1,.14,w.col,0,.02,w.len+.04,1));g.add(box(.12,.22,.12,0x222a38,0,-.14,.12));return g}
function buildChar(id,gun){
 const S=SK[id]||SK.pixel_knight,g=new T.Group(),o={g,fx:[],id};
 const legs=new T.Group();g.add(legs);
 o.legL=new T.Group();o.legL.position.set(-.18,.9,0);o.legL.add(box(.3,.9,.34,S.leg,0,-.45,0));
 o.legR=new T.Group();o.legR.position.set(.18,.9,0);o.legR.add(box(.3,.9,.34,S.leg,0,-.45,0));g.add(o.legL,o.legR);
 const torso=box(.74,.8,.4,S.body,0,1.3,0);g.add(torso);
 g.add(box(.76,.12,.42,S.glow,0,1.0,0,1));
 o.armL=new T.Group();o.armL.position.set(-.5,1.62,0);o.armL.add(box(.24,.75,.26,S.body,0,-.34,0),box(.22,.2,.24,S.skin,0,-.78,0));
 o.armR=new T.Group();o.armR.position.set(.5,1.62,0);o.armR.add(box(.24,.75,.26,S.body,0,-.34,0),box(.22,.2,.24,S.skin,0,-.78,0));g.add(o.armL,o.armR);
 if(gun!=null){o.gun=gunMesh(gun);o.gun.position.set(0,-.78,.1);o.armR.add(o.gun)}
 o.head=new T.Group();o.head.position.set(0,1.95,0);g.add(o.head);
 o.head.add(box(.52,.52,.52,S.skin,0,0,0));
 o.head.add(box(.1,.07,.04,0x111111,-.12,.04,.27),box(.1,.07,.04,0x111111,.12,.04,.27));
 const H=S.hat;
 if(H==='knight'){o.head.add(box(.58,.34,.58,0xaab4c6,0,.14,0),box(.6,.12,.6,0x8c97ab,0,-.02,0),box(.1,.5,.34,0xd8404f,0,.5,-.05),box(.36,.07,.04,0x10131c,0,.02,.31));g.add(box(.5,.5,.1,0x8c97ab,0,1.3,.26))}
 if(H==='ninja'){o.head.add(box(.58,.5,.58,0x15181f,0,.02,0),box(.4,.1,.04,S.glow,0,.04,.31,1),box(.6,.1,.6,0x39ffb6,0,.2,0,1));o.tail=[box(.1,.1,.5,S.glow,-.08,.2,-.5,1),box(.1,.1,.5,S.glow,.08,.2,-.5,1)];o.tail.forEach(t=>o.head.add(t))}
 if(H==='mage'){o.head.add(box(.7,.1,.7,0x2a4f93,0,.3,0),box(.5,.3,.5,0x3b7bd8,0,.48,0),box(.3,.3,.3,0x3b7bd8,0,.75,0),box(.14,.2,.14,0x7fe3ff,0,.98,0,1),box(.5,.3,.18,0xdfe9ff,0,-.32,.2));g.add(box(.96,.45,.56,0x3b7bd8,0,.62,0))}
 if(H==='samurai'){o.head.add(box(.62,.34,.62,0x1c1828,0,.2,0),box(.5,.14,.05,0xff4fd8,0,.0,.32,1),box(.09,.5,.09,0xd9a82b,-.2,.55,.1),box(.09,.5,.09,0xd9a82b,.2,.55,.1));g.add(box(.1,.1,1.5,0x9fa6b8,.18,1.6,-.4));g.add(box(.78,.2,.44,0xff4fd8,0,1.62,0,1))}
 if(H==='hazmat'){o.head.add(box(.62,.6,.62,0xe3c628,0,.05,0),box(.46,.2,.08,0xb6ff3b,0,.05,.33,1),box(.3,.22,.18,0x555c66,0,-.16,.36));g.add(box(.4,.7,.25,0x666d78,0,1.3,-.34),box(.2,.2,.1,0xb6ff3b,0,1.5,-.48,1))}
 if(H==='demon'){o.head.add(box(.1,.1,.04,0xffe14d,-.12,.04,.28,1),box(.1,.1,.04,0xffe14d,.12,.04,.28,1),box(.12,.4,.12,0x2a0a07,-.22,.42,0),box(.12,.4,.12,0x2a0a07,.22,.42,0),box(.1,.18,.1,0xff6a2b,-.3,.7,0,1),box(.1,.18,.1,0xff6a2b,.3,.7,0,1));o.tail=[box(.1,.1,.6,0xc7311f,0,.5,-.5)];g.add(o.tail[0])}

   e.bar.position.set(e.pos.x,(2.7)*d.sc*.9+.3,e.pos.z);e.fg.scale.x=Math.max(.001,e.hp/e.max);e.fg.position.x=-(1-e.hp/e.max)*.6;
  }
  for(let i=enemies.length-1;i>=0;i--){const e=enemies[i];if(e.dead>.45){scene.remove(e.ch.g);scene.remove(e.bar);enemies.splice(i,1)}}
  /* player bullets */
  for(let i=pb.length-1;i>=0;i--){const b=pb[i],px=b.m.position.x,pz=b.m.position.z,nx=px+b.vx*dt,nz=pz+b.vz*dt;let rm=false;
   for(const e of enemies){if(e.dead||b.hit.has(e))continue;const sx=nx-px,sz=nz-pz,l2=sx*sx+sz*sz||1e-6;let u=((e.pos.x-px)*sx+(e.pos.z-pz)*sz)/l2;u=Math.max(0,Math.min(1,u));const cx=px+sx*u-e.pos.x,cz=pz+sz*u-e.pos.z;
    if(cx*cx+cz*cz<(e.d.r+.15)**2){e.hp-=b.dmg;b.hit.add(e);spark(new V3(e.pos.x,0,e.pos.z),2,0xffffff);if(e.hp<=0)killEnemy(e);if(!b.w.pierce){rm=true;break}}}
   b.m.position.set(nx,1.2,nz);b.life-=dt;
   for(const c of colBoxes)if(Math.abs(nx-c.x)<c.hw&&Math.abs(nz-c.z)<c.hd){rm=true}
   if(rm||b.life<=0||Math.abs(nx)>ARENA+1||Math.abs(nz)>ARENA+1){scene.remove(b.m);pb.splice(i,1)}}
  /* enemy bullets */
  for(let i=eb.length-1;i>=0;i--){const b=eb[i];b.m.position.x+=b.vx*dt;b.m.position.z+=b.vz*dt;b.life-=dt;let rm=b.life<=0;
   if(Math.hypot(b.m.position.x-P.pos.x,b.m.position.z-P.pos.z)<.7){hurt(b.dmg);rm=true}
   for(const c of colBoxes)if(Math.abs(b.m.position.x-c.x)<c.hw&&Math.abs(b.m.position.z-c.z)<c.hd)rm=true;
   if(rm){scene.remove(b.m);eb.splice(i,1)}}
  /* pickups */
  for(let i=pickups.length-1;i>=0;i--){const p=pickups[i];p.g.rotation.y=t*3;p.g.position.y=.7+Math.sin(t*4)*.12;if(Math.hypot(p.x-P.pos.x,p.z-P.pos.z)<1.3){P.hp=Math.min(100,P.hp+30);scene.remove(p.g);pickups.splice(i,1);hud();toast('+30 HP')}}
  flushT+=dt;if(flushT>4){flushT=0;flush()}
 }
 for(let i=sparks.length-1;i>=0;i--){const s=sparks[i];s.life-=dt;s.v.y-=14*dt;s.m.position.addScaledVector(s.v,dt);s.m.scale.setScalar(Math.max(.01,s.life*2));if(s.life<=0||s.m.position.y<0){scene.remove(s.m);sparks.splice(i,1)}}
 /* camera */
 shake*=.88;const tx=P.pos.x,tz=P.pos.z;camP.x+=(tx-camP.x)*Math.min(1,dt*6);camP.z+=(tz-camP.z)*Math.min(1,dt*6);
 cam.position.set(camP.x+(Math.random()-.5)*shake,17+(Math.random()-.5)*shake,camP.z+11);cam.lookAt(camP.x,0,camP.z-1);
 if(mode==='over'&&!enemies.length)return;
}
