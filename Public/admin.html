<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Admin · Gram Shooter</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#f6f7fb;--card:#fff;--line:#e6e9f2;--tx:#12162b;--mut:#7a8199;--ac:#4b3df5;--ok:#0aa877;--red:#e5384f;--gold:#c98a00}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;padding:max(14px,env(safe-area-inset-top)) 14px 40px;background:var(--bg);color:var(--tx);font:15px/1.5 "Vazirmatn",-apple-system,Inter,Roboto,sans-serif}
html[dir=rtl] body{font-family:"Vazirmatn",Tahoma,sans-serif}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
h1{margin:0;font-size:20px}
.lang{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.lang button{border:0;background:none;padding:6px 12px;font:600 12px inherit;color:var(--mut)}.lang button.on{background:var(--ac);color:#fff}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}
.tabs button{flex:1;white-space:nowrap;border:1px solid var(--line);background:var(--card);padding:9px 12px;border-radius:11px;font:600 13px inherit;color:var(--mut)}
.tabs button.on{background:var(--tx);color:#fff;border-color:var(--tx)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}.stat b{display:block;font-size:20px}.stat span,.mut{font-size:12px;color:var(--mut)}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
input[type=text],input[type=number]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:#fff;font:15px inherit;color:var(--tx);outline:0}
input:focus{border-color:var(--ac)}
.row{display:flex;gap:8px;align-items:center}.row>input[type=number],.row>input[type=text]{flex:1;min-width:0}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--ac)}
button.b{border:0;border-radius:10px;padding:9px 14px;background:var(--ac);color:#fff;font:700 13px inherit;cursor:pointer}
button.b.g{background:#eef0f8;color:var(--tx)}button.b.r{background:var(--red)}button.b:active{opacity:.8}
.it{padding:10px 0;border-top:1px solid var(--line)}.it:first-child{border-top:0}.it .n{font-weight:700;margin-bottom:6px}
.pill{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:#eef0f8}.pill.sent{background:#d9f7ec;color:var(--ok)}.pill.pending,.pill.processing{background:#fff1cc;color:var(--gold)}.pill.failed{background:#ffe0e5;color:var(--red)}
.danger{border-color:#f5b8c1;background:#fff6f7}.danger h3{color:var(--red)}
h3{margin:0 0 6px;font-size:15px}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,90px);background:var(--tx);color:#fff;padding:10px 18px;border-radius:12px;transition:.3s;font-size:13px}#toast.on{transform:translate(-50%,0)}
.p{display:none}.p.on{display:block}
</style></head><body>
<div class="top"><h1 data-i="title"></h1><div class="lang"><button data-l="en">EN</button><button data-l="fa">فا</button></div></div>
<div class="tabs" id="tabs"><button data-t="home" data-i="t_home"></button><button data-t="items" data-i="t_items"></button><button data-t="wd" data-i="t_wd"></button><button data-t="pl" data-i="t_pl"></button></div>

<div class="p" id="p_home">
  <div class="stats"><div class="stat"><b id="hot">–</b><span data-i="hot"></span></div><div class="stat"><b id="plc">–</b><span data-i="players"></span></div></div>
  <div class="card"><h3 data-i="eco"></h3><div id="eco"></div></div>
  <div class="card"><h3 data-i="addr"></h3><div class="mut" id="addr" style="word-break:break-all;direction:ltr"></div></div>
</div>
<div class="p" id="p_items"><div class="card" id="items"></div></div>
<div class="p" id="p_wd"><div class="card" id="wd"></div></div>
<div class="p" id="p_pl">
  <div class="card"><h3 data-i="user"></h3><label data-i="tid"></label><input id="uid" type="text" inputmode="numeric" dir="ltr">
    <div class="row" style="margin-top:10px"><button class="b r" onclick="ban(true)" data-i="ban"></button><button class="b g" onclick="ban(false)" data-i="unban"></button><button class="b g" onclick="resetUser()" data-i="reset1"></button></div></div>
  <div class="card danger"><h3 data-i="resetAll"></h3><div class="mut" data-i="resetWarn" style="margin-bottom:10px"></div><button class="b r" onclick="resetAll()" data-i="resetBtn"></button></div>
</div>
<div id="toast"></div>
<script>
const TG=window.Telegram&&Telegram.WebApp;if(TG){TG.ready();TG.expand()}
const $=id=>document.getElementById(id),f=n=>Number(n)/1e9;
const D={en:{title:'Admin',t_home:'Overview',t_items:'Shop',t_wd:'Withdrawals',t_pl:'Players',hot:'Hot wallet (TON)',players:'Players',eco:'Economy',addr:'Payment wallet',user:'Player tools',tid:'Telegram ID',ban:'Ban',unban:'Unban',reset1:'Zero balance',resetAll:'Reset all balances',resetWarn:'Sets every player\'s TON balance to 0. Pending withdrawals are not touched. This cannot be undone.',resetBtn:'Reset everyone to 0',save:'Save',saved:'Saved ✔',refund:'Refund',none:'Nothing here yet',gun:'Gun',skin:'Skin',
  k_reward_per_kill_nano:'Reward per kill (TON)',k_min_withdraw_nano:'Minimum withdrawal (TON)',k_withdraw_fee_nano:'Withdrawal fee (TON)',k_daily_withdraw_cap_nano:'Daily cap per player (TON)',k_min_deposit_nano:'Minimum deposit (TON)',k_max_kills_per_minute:'Max kills / minute',
  cRefund:'Refund this withdrawal? Only if it was NOT paid on-chain.',cReset1:'Set this player\'s balance to 0?',cAll:'Type RESET to zero ALL player balances:',noid:'Enter a Telegram ID',done:'Done ✔',cnt:'Players reset: '},
fa:{title:'پنل مدیریت',t_home:'نمای کلی',t_items:'فروشگاه',t_wd:'برداشت‌ها',t_pl:'بازیکنان',hot:'موجودی ولت اصلی (TON)',players:'تعداد بازیکنان',eco:'اقتصاد بازی',addr:'ولت دریافت',user:'ابزار بازیکن',tid:'آیدی تلگرام',ban:'بن',unban:'رفع بن',reset1:'صفر کردن موجودی',resetAll:'صفر کردن موجودی همه',resetWarn:'موجودی TON همه بازیکنان صفر میشه. برداشت‌های در انتظار دست‌نخورده می‌مونن. این کار برگشت‌پذیر نیست.',resetBtn:'صفر کردن همه',save:'ذخیره',saved:'ذخیره شد ✔',refund:'بازگشت وجه',none:'چیزی نیست',gun:'تفنگ',skin:'اسکین',
  k_reward_per_kill_nano:'پاداش هر کیل (TON)',k_min_withdraw_nano:'حداقل برداشت (TON)',k_withdraw_fee_nano:'کارمزد برداشت (TON)',k_daily_withdraw_cap_nano:'سقف روزانه هر بازیکن (TON)',k_min_deposit_nano:'حداقل واریز (TON)',k_max_kills_per_minute:'حداکثر کیل در دقیقه',
  cRefund:'این برداشت برگردانده بشه؟ فقط اگه روی بلاکچین پرداخت نشده.',cReset1:'موجودی این بازیکن صفر بشه؟',cAll:'برای صفر کردن موجودی همه، RESET رو تایپ کن:',noid:'آیدی تلگرام رو وارد کن',done:'انجام شد ✔',cnt:'تعداد بازیکن صفرشده: '}};
let L=localStorage.getItem('lang')||((TG&&TG.initDataUnsafe&&TG.initDataUnsafe.user&&TG.initDataUnsafe.user.language_code==='fa')?'fa':'en'),DATA=null;
const t=k=>D[L][k]||k;
function applyLang(){document.documentElement.lang=L;document.documentElement.dir=L==='fa'?'rtl':'ltr';localStorage.setItem('lang',L);
 document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===L));if(DATA)render()}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{L=b.dataset.l;applyLang()});
function toast(m){const e=$('toast');e.textContent=m;e.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>e.classList.remove('on'),2200)}
async function api(p,b){const r=await fetch(p,{method:b?'POST':'GET',headers:{'Content-Type':'application/json','X-Init':(TG&&TG.initData)||''},body:b?JSON.stringify(b):undefined});const j=await r.json();if(!r.ok)throw new Error(j.error||'Error');return j}
function tab(k){document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===k));document.querySelectorAll('.p').forEach(p=>p.classList.toggle('on',p.id==='p_'+k))}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>tab(b.dataset.t));
const KEYS=['reward_per_kill_nano','min_withdraw_nano','withdraw_fee_nano','daily_withdraw_cap_nano','min_deposit_nano','max_kills_per_minute'];
function row(id,price,on,fn){return `<div class="row"><input id="p_${id}" type="number" step="any" value="${price}" dir="ltr"><input id="a_${id}" type="checkbox" ${on?'checked':''}><button class="b" onclick="${fn}('${id}')">${t('save')}</button></div>`}
function render(){const d=DATA,cfg=d.cfg||{};
 $('hot').textContent=d.hot!=null?f(d.hot).toFixed(3):'–';$('plc').textContent=d.players??'–';$('addr').textContent=d.address||'–';
 $('eco').innerHTML=KEYS.map(k=>{const ton=k!=='max_kills_per_minute',v=ton?f(cfg[k]||0):(cfg[k]??0);return `<label>${t('k_'+k)}</label><div class="row"><input id="c_${k}" type="number" step="any" value="${v}" dir="ltr"><button class="b" onclick="sv('${k}',${ton})">${t('save')}</button></div>`}).join('');
 const guns=(d.guns&&d.guns.length?d.guns:d.weapons||[]).map(g=>`<div class="it"><div class="n">🔫 ${g.name||g.id} <span class="mut">${t('gun')}</span></div>${row(g.id,f(g.price_nano||0),g.active!==false,'sg')}</div>`);
 const skins=(d.skins||[]).map(s=>`<div class="it"><div class="n">🎨 ${(s.gun||'').toUpperCase()} · ${s.name||s.id} <span class="mut">${s.rarity||''}</span></div>${row('s_'+s.id,f(s.price_nano||0),s.active!==false,'ss')}</div>`);
 $('items').innerHTML=[...guns,...skins].join('')||`<div class="mut">${t('none')}</div>`;
 $('wd').innerHTML=(d.withdrawals||[]).map(w=>`<div class="it row" style="justify-content:space-between"><div><b>#${w.id}</b> · ${w.telegram_id}<div class="mut" dir="ltr">${(w.address||'').slice(0,14)}…</div>${w.error?`<div class="mut">${w.error}</div>`:''}</div><div style="text-align:end"><b>${f(w.amount_nano).toFixed(3)} TON</b><div><span class="pill ${w.status}">${w.status}</span></div>${w.status==='failed'?`<button class="b r" style="margin-top:6px;padding:5px 10px" onclick="rf(${w.id})">${t('refund')}</button>`:''}</div></div>`).join('')||`<div class="mut">${t('none')}</div>`}
async function load(){try{DATA=await api('/api/admin/overview');render()}catch(e){document.body.innerHTML=`<div style="padding:40px 20px;text-align:center"><h3 style="color:#e5384f">${e.message}</h3></div>`}}
async function run(fn,ok){try{await fn();toast(ok||t('saved'))}catch(e){toast(e.message)}}
const sv=(k,ton)=>run(()=>api('/api/admin/settings',{key:k,value:ton?Math.round(Number($('c_'+k).value)*1e9):Number($('c_'+k).value)}));
const sg=id=>run(async()=>{const b={id,price_nano:Math.round(Number($('p_'+id).value)*1e9),active:$('a_'+id).checked};await api('/api/admin/gun',b);try{await api('/api/admin/weapon',b)}catch(_){}});
const ss=id=>run(()=>api('/api/admin/skin',{id:id.slice(2),price_nano:Math.round(Number($('p_'+id).value)*1e9),active:$('a_'+id).checked}));
const rf=id=>confirm(t('cRefund'))&&run(async()=>{await api('/api/admin/refund',{id});load()},t('done'));
const ban=b=>{const v=$('uid').value.trim();if(!v)return toast(t('noid'));run(()=>api('/api/admin/ban',{telegram_id:v,banned:b}),t('done'))};
const resetUser=()=>{const v=$('uid').value.trim();if(!v)return toast(t('noid'));confirm(t('cReset1'))&&run(()=>api('/api/admin/reset-user',{telegram_id:v}),t('done'))};
const resetAll=async()=>{if((prompt(t('cAll'))||'').trim()!=='RESET')return;try{const r=await api('/api/admin/reset-balances',{confirm:'RESET'});toast(t('cnt')+r.count)}catch(e){toast(e.message)}};
applyLang();tab('home');load();
</script></body></html>
